function targetMeaning(w){let parts=w.meaning.split(/[;；]/).map(x=>x.trim()).filter(Boolean);return parts.length>1?parts[1]:parts[0]}
function makeQueue(onlyWrong=false){let d=$('#quizDay').value;let pool=words.filter(w=>(d==='all'||w.day==d));if(onlyWrong){pool=pool.filter(w=>state.wrong.some(x=>x.word===w.word));state.mode='wrong'}else if($('#quizMode').value==='second'){pool=pool.filter(w=>/[;；]/.test(w.meaning));state.mode='second'}else state.mode='all';pool=pool.sort(()=>Math.random()-.5);state.queue=pool;state.idx=0;state.score=0;state.answered=false;showQuestion()}
function showQuestion(){const area=$('#quizArea');if(state.idx>=state.queue.length){area.innerHTML=`<div class="empty"><div style="font-size:32px">🎉</div><b>퀴즈 끝!</b><br>${state.queue.length}문제 중 ${state.score}문제를 첫 시도에 맞혔어.</div><button class="primary wide" id="again">다시 풀기</button>`;$('#again').onclick=()=>makeQueue(state.mode==='wrong');$('#quizProgress').style.width='100%';return}const w=state.queue[state.idx],answer=state.mode==='second'?targetMeaning(w):w.meaning.split(/[;；]/)[0].trim();let opts=[answer];let others=words.filter(x=>x.word!==w.word).map(x=>state.mode==='second'?targetMeaning(x):x.meaning.split(/[;；]/)[0].trim()).filter(x=>x&&x!==answer);others=[...new Set(others)].sort(()=>Math.random()-.5);while(opts.length<4&&others.length)opts.push(others.shift());opts=opts.sort(()=>Math.random()-.5);state.current={w,answer,opts};state.answered=false;$('#quizProgress').style.width=(state.idx/state.queue.length*100)+'%';area.innerHTML=`<div class="question">${state.idx+1} / ${state.queue.length} · ${w.day}강</div><div class="word">${esc(w.word)}</div><div class="question">알맞은 뜻을 선택해 줘.</div><div class="options">${opts.map((o,i)=>`<button class="option" data-opt="${i}">${i+1}. ${esc(o)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><button id="next" class="primary wide" disabled>${state.idx===state.queue.length-1?'결과 보기':'다음 문제'}</button>`;$$('[data-opt]').forEach((b,i)=>b.onclick=()=>answerQuestion(b,opts[i]));$('#next').onclick=()=>{state.idx++;showQuestion()}}
function answerQuestion(btn,chosen){if(state.answered)return;state.answered=true;const {w,answer}=state.current;const correct=chosen===answer;if(correct)state.score++;$$('[data-opt]').forEach(b=>{b.disabled=true;const val=b.textContent.replace(/^\d+\. /,'');if(val===answer)b.classList.add('correct')});if(!correct){btn.classList.add('wrong');let found=state.wrong.find(x=>x.word===w.word);if(found){found.count=(found.count||1)+1}else state.wrong.push({word:w.word,day:w.day,meaning:w.meaning,count:1})}else{state.wrong=state.wrong.filter(x=>x.word!==w.word)}$('#feedback').textContent=correct?'정답이야! ✨':'아쉬워! 정답: '+answer;$('#feedback').style.color=correct?'var(--good)':'var(--bad)';$('#next').disabled=false;save()}
$('#startQuiz').onclick=()=>makeQueue(false);$('#reviewQuiz').onclick=()=>{ $$('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='quiz'));$$('.view').forEach(v=>v.classList.toggle('hidden',v.id!=='quiz'));makeQueue(true)};
function renderReview(){const area=$('#reviewList');area.innerHTML=state.wrong.length?state.wrong.map(w=>`<div class="worditem"><div><span class="pill">${w.day}강</span><b style="margin-left:7px">${esc(w.word)}</b><small>${esc(w.meaning)}</small><small>오답 ${w.count||1}회</small></div><button class="secondary" data-remove="${esc(w.word)}">삭제</button></div>`).join(''):'<div class="empty">아직 오답이 없어!<br>퀴즈에서 틀린 단어가 여기에 모여.</div>';$$('[data-remove]').forEach(b=>b.onclick=()=>{state.wrong=state.wrong.filter(w=>w.word!==b.dataset.remove);save();renderReview()});$('#reviewQuiz').disabled=!state.wrong.length;$('#reviewQuiz').style.opacity=state.wrong.length?1:.5}
$('#clearWrong').onclick=()=>{if(confirm('오답 기록을 모두 지울까?')){state.wrong=[];save();renderReview()}};
updateStats();renderWords();renderReview();
</script></body></html>
